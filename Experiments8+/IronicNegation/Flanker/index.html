        <script src="../../../jspsych-8.0.2/dist/plugin-external-html.js"></script>
        <script src="../../../jspsych-8.0.2/dist/plugin-html-keyboard-response.js"></script>
        <script src="../../../jspsych-8.0.2/dist/plugin-canvas-keyboard-response.js"></script>
        <script src="../../../jspsych-8.0.2/dist/plugin-call-function.js"></script>
        <script src="../../../jspsych-8.0.2/dist/plugin-browser-check.js"></script>

        <style>
            html, body {
                background-color: #f8fafc;
                color: #1e293b;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                margin: 0;
                padding: 0;
                height: 100%;
                overflow-x: hidden;
            }
            .jspsych-display-element {
                background-color: #f8fafc;
                color: #1e293b;
            }
            .instruction-card {
                max-width: 820px;
                margin: 0 auto;
                background-color: #ffffff;
                border: 1px solid #e2e8f0;
                border-radius: 12px;
                padding: 35px 45px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                text-align: center;
                line-height: 1.7;
            }
            .instruction-header {
                font-size: 26px;
                font-weight: 700;
                color: #0f172a;
                margin-bottom: 20px;
            }
            .instruction-goal-box {
                margin: 25px 0;
                font-size: 23px;
                font-weight: 700;
                color: #0f172a;
                letter-spacing: 0.3px;
                line-height: 1.6;
            }
            .mapping-container {
                display: flex;
                justify-content: center;
                gap: 50px;
                margin: 30px 0;
            }
            .key-box {
                background-color: #f8fafc;
                border: 1px solid #cbd5e1;
                border-radius: 10px;
                padding: 16px 24px;
                min-width: 170px;
                display: flex;
                flex-direction: column;
                align-items: center;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            }
            kbd {
                display: inline-block;
                padding: 8px 16px;
                font-family: monospace;
                font-size: 28px;
                font-weight: bold;
                color: #0f172a;
                background: #ffffff;
                border: 1px solid #94a3b8;
                border-radius: 8px;
                box-shadow: 0 3px 0 #cbd5e1, 0 4px 6px rgba(0, 0, 0, 0.08);
                margin-bottom: 12px;
            }
            .key-finger {
                font-size: 13px;
                color: #64748b;
                margin-top: 4px;
            }
            .key-target {
                font-size: 18px;
                font-weight: bold;
                margin-top: 8px;
                color: #0f172a;
            }
            .prompt-continue {
                margin-top: 30px;
                font-size: 16px;
                color: #64748b;
                font-style: italic;
            }
        </style>
    </head>
