<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Demographic Information</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            margin: 0;
            padding: 20px;
        }
        #vpInfo {
            background-color: #ffffff;
            padding: 35px 45px;
            border-radius: 10px;
            max-width: 500px;
            width: 100%;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h2 {
            margin-top: 0;
            color: #0f172a;
            border-bottom: 2px solid #2563eb;
            padding-bottom: 10px;
        }
        legend {
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 8px;
            font-size: 1.05em;
        }
        .form-group {
            margin-bottom: 22px;
        }
        input[type="number"] {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            color: #0f172a;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 1em;
            width: 100px;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 6px;
        }
        .radio-label {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            color: #334155;
            font-size: 0.95em;
        }
        .radio-label input {
            margin-right: 7px;
            accent-color: #2563eb;
            transform: scale(1.2);
        }
        .consent-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
            color: #334155;
        }
        .consent-row input {
            accent-color: #2563eb;
            transform: scale(1.3);
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 13px 20px;
            font-size: 1.05em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 22px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div id="vpInfo">
        <h2>Participant Details</h2>
        
        <div class="form-group">
            <legend>Age</legend>
            <input type="number" id="age" min="18" max="99" placeholder="Years" required />
        </div>

        <div class="form-group">
            <legend>Gender</legend>
            <div class="radio-group">
                <label class="radio-label"><input type="radio" name="gender" id="male" value="male" /> Male</label>
                <label class="radio-label"><input type="radio" name="gender" id="female" value="female" /> Female</label>
                <label class="radio-label"><input type="radio" name="gender" id="divers" value="na" /> Other / Prefer not to say</label>
            </div>
        </div>

        <div class="form-group">
            <legend>Dominant Hand</legend>
            <div class="radio-group">
                <label class="radio-label"><input type="radio" name="handedness" id="right" value="right" /> Right</label>
                <label class="radio-label"><input type="radio" name="handedness" id="left" value="left" /> Left</label>
            </div>
        </div>

        <div class="consent-row">
            <input type="checkbox" id="consent_checkbox" />
            <label for="consent_checkbox" style="cursor: pointer;">I agree to participate in this study under the conditions explained.</label>
        </div>

        <button type="button" id="start">Continue to Instructions</button>
    </div>
</body>
</html>
